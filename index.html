
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSK Classes | Premium Management Portal</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1",
    "recharts": "https://esm.sh/recharts@2.10.3",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .portal-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .btn-primary { background: #4f46e5; color: white; transition: all 0.2s; }
        .btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import ReactDOM from 'react-dom';
        import * as Lucide from 'lucide-react';
        import { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, 
            ResponsiveContainer, Cell, LineChart, Line 
        } from 'recharts';
        import { GoogleGenAI, Type } from "@google/genai";

        // --- Core Configuration ---
        const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [appMode, setAppMode] = useState('teacher'); // teacher, portal, quiz-player
            const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('msk_students') || '[]'));
            const [quizzes, setQuizzes] = useState(() => JSON.parse(localStorage.getItem('msk_quizzes') || '[]'));
            const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('msk_schedule') || '[]'));
            const [facts, setFacts] = useState([]);
            
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [isScanning, setIsScanning] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            // Persist Data
            useEffect(() => {
                localStorage.setItem('msk_students', JSON.stringify(students));
                localStorage.setItem('msk_quizzes', JSON.stringify(quizzes));
                localStorage.setItem('msk_schedule', JSON.stringify(schedule));
            }, [students, quizzes, schedule]);

            // Daily Facts Fetch
            useEffect(() => {
                fetchDailyKnowledge();
                handleRouting();
                window.addEventListener('hashchange', handleRouting);
                return () => window.removeEventListener('hashchange', handleRouting);
            }, []);

            const handleRouting = () => {
                const hash = window.location.hash;
                if (hash.startsWith('#portal')) {
                    const sid = new URLSearchParams(hash.split('?')[1]).get('sid');
                    const student = students.find(s => s.rollNumber.toLowerCase() === sid?.toLowerCase());
                    if (student) { setAppMode('portal'); setSelectedStudent(student); }
                } else { setAppMode('teacher'); }
            };

            const fetchDailyKnowledge = async () => {
                try {
                    const response = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: "Generate 3 short, interesting academic facts for students (Maths, Science, History). JSON array: [{title, desc}]",
                        config: { 
                            responseMimeType: "application/json",
                            responseSchema: { type: Type.ARRAY, items: { type: Type.OBJECT, properties: { title: { type: Type.STRING }, desc: { type: Type.STRING } } } }
                        }
                    });
                    setFacts(JSON.parse(response.text || "[]"));
                } catch (e) { setFacts([{ title: "Learning is Key", desc: "Knowledge expands the mind beyond its current limits." }]); }
            };

            // --- AI Features ---
            const handleScanMarkSheet = async (studentId, file) => {
                setIsScanning(true);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    try {
                        const response = await ai.models.generateContent({
                            model: 'gemini-3-flash-preview',
                            contents: [{ parts: [{ inlineData: { data: base64, mimeType: file.type } }, { text: "Extract test marks from this image. JSON: [{subject, score, total}]" }] }],
                            config: { responseMimeType: "application/json" }
                        });
                        const results = JSON.parse(response.text || "[]");
                        if (results.length > 0) {
                            const updated = students.map(s => s.id === studentId ? { ...s, marks: [...results, ...s.marks] } : s);
                            setStudents(updated);
                            alert("AI Scan Successful! Marks added.");
                        }
                    } catch (e) { alert("AI Scan failed. Please try a clearer photo."); }
                    finally { setIsScanning(false); }
                };
            };

            const generateQuiz = async (subject, topic) => {
                setIsGenerating(true);
                try {
                    const response = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: `Generate 5 high-quality MCQs for ${subject} on topic: ${topic}. JSON: [{q, options:[], correct:index}]`,
                        config: { responseMimeType: "application/json" }
                    });
                    const qs = JSON.parse(response.text || "[]");
                    const newQuiz = { id: Date.now().toString(), topic, subject, questions: qs, code: Math.random().toString(36).substr(2,4).toUpperCase() };
                    setQuizzes([newQuiz, ...quizzes]);
                    alert(`Quiz Created! Code: ${newQuiz.code}`);
                } catch (e) { alert("Generation failed."); }
                finally { setIsGenerating(false); }
            };

            // --- Layout Components ---
            const NavItem = ({ id, icon, label }) => (
                <button 
                    onClick={() => { setView(id); setSelectedStudent(null); }}
                    className={`flex flex-col lg:flex-row items-center gap-1 lg:gap-4 lg:w-full lg:px-6 lg:py-4 rounded-2xl transition-all ${view === id ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:text-slate-900'}`}
                >
                    {React.createElement(Lucide[icon], { size: 20 })}
                    <span className="text-[9px] lg:text-sm font-bold uppercase lg:capitalize">{label}</span>
                </button>
            );

            const Sidebar = () => (
                <aside className="fixed bottom-0 left-0 w-full h-16 bg-white border-t lg:static lg:h-screen lg:w-64 lg:border-r lg:border-t-0 z-50 flex lg:flex-col">
                    <div className="hidden lg:flex h-20 items-center px-8 border-b mb-4">
                        <div className="h-10 w-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black shadow-lg mr-3">M</div>
                        <h1 className="font-extrabold text-xl tracking-tighter">MSK Portal</h1>
                    </div>
                    <nav className="flex h-full items-center justify-around w-full lg:flex-col lg:justify-start lg:gap-1 lg:px-3">
                        <NavItem id="dashboard" icon="LayoutDashboard" label="Dashboard" />
                        <NavItem id="roster" icon="Users" label="Roster" />
                        <NavItem id="quizzes" icon="Brain" label="AI Quizzes" />
                        <NavItem id="timetable" icon="Calendar" label="Schedule" />
                        <NavItem id="knowledge" icon="Sparkles" label="Daily GK" />
                    </nav>
                </aside>
            );

            // --- Portal Logic ---
            if (appMode === 'portal') {
                return (
                    <div className="min-h-screen bg-slate-50 animate-fade-in p-6">
                        <header className="flex items-center justify-between mb-8">
                            <div className="flex items-center gap-3">
                                <div className="h-10 w-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black">M</div>
                                <h1 className="font-black text-xl">Student Hub</h1>
                            </div>
                            <button onClick={() => { window.location.hash = ""; setAppMode('teacher'); }} className="p-3 bg-white rounded-xl text-slate-400 shadow-sm"><Lucide.LogOut size={20}/></button>
                        </header>
                        <div className="max-w-2xl mx-auto space-y-6">
                            <div className="portal-gradient p-10 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                                <h2 className="text-4xl font-black mb-1">{selectedStudent.name}</h2>
                                <p className="font-bold opacity-80 uppercase tracking-widest text-xs">Roll #{selectedStudent.rollNumber} • {selectedStudent.batch}</p>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="glass-card p-6 rounded-3xl text-center shadow-sm">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Score</p>
                                    <h3 className="text-3xl font-black text-indigo-600">{selectedStudent.marks.reduce((a, b) => a + b.score, 0)}</h3>
                                </div>
                                <div className="glass-card p-6 rounded-3xl text-center shadow-sm">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Tests Done</p>
                                    <h3 className="text-3xl font-black text-green-500">{selectedStudent.marks.length}</h3>
                                </div>
                            </div>
                            <div className="glass-card p-8 rounded-[2.5rem]">
                                <h4 className="font-black mb-4 flex items-center gap-2"><Lucide.Award className="text-indigo-600"/> Results History</h4>
                                <div className="space-y-3">
                                    {selectedStudent.marks.map((m, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="font-black text-slate-700">{m.subject}</span>
                                            <span className="font-black text-indigo-600">{m.score}/{m.total}</span>
                                        </div>
                                    ))}
                                    {selectedStudent.marks.length === 0 && <p className="text-center text-slate-400 italic">No tests found.</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen">
                    <Sidebar />
                    <main className="flex-1 p-6 lg:p-10 pb-24 lg:pb-10 max-w-7xl mx-auto w-full">
                        
                        {view === 'dashboard' && (
                            <div className="animate-fade-in space-y-8">
                                <header>
                                    <h2 className="text-3xl font-black text-slate-900 tracking-tight">Overview</h2>
                                    <p className="text-slate-400 font-semibold text-sm">Managing {students.length} students across all batches.</p>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="glass-card p-8 rounded-[2.5rem] flex items-center justify-between">
                                        <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Students</p><h3 className="text-3xl font-black text-indigo-600">{students.length}</h3></div>
                                        <div className="h-12 w-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center"><Lucide.Users /></div>
                                    </div>
                                    <div className="glass-card p-8 rounded-[2.5rem] flex items-center justify-between">
                                        <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Active Quizzes</p><h3 className="text-3xl font-black text-amber-600">{quizzes.length}</h3></div>
                                        <div className="h-12 w-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center"><Lucide.Brain /></div>
                                    </div>
                                    <div className="glass-card p-8 rounded-[2.5rem] flex items-center justify-between">
                                        <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Schedule</p><h3 className="text-3xl font-black text-green-600">{schedule.length}</h3></div>
                                        <div className="h-12 w-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center"><Lucide.Calendar /></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="glass-card rounded-[2.5rem] p-8 min-h-[300px]">
                                        <h4 className="text-xl font-black text-slate-900 mb-6 flex items-center gap-2"><Lucide.History className="text-indigo-600"/> Latest Activities</h4>
                                        <div className="flex items-center justify-center h-48 text-slate-300 italic">No recent logs found.</div>
                                    </div>
                                    <div className="glass-card rounded-[2.5rem] p-8">
                                        <h4 className="text-xl font-black text-slate-900 mb-6 flex items-center gap-2"><Lucide.Sparkles className="text-indigo-600"/> Daily GK Hub</h4>
                                        <div className="space-y-4">
                                            {facts.map((f, i) => (
                                                <div key={i} className="p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100">
                                                    <p className="font-black text-sm text-indigo-900 mb-1">{f.title}</p>
                                                    <p className="text-xs text-slate-600 leading-relaxed">{f.desc}</p>
                                                </div>
                                            ))}
                                            <button onClick={fetchDailyKnowledge} className="text-indigo-600 text-xs font-black uppercase tracking-widest hover:underline">+ Refresh Hub</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'roster' && !selectedStudent && (
                            <div className="animate-fade-in space-y-8">
                                <header className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black text-slate-900 tracking-tight">Student Roster</h2>
                                    <button 
                                        onClick={() => {
                                            const name = prompt("Student Name:");
                                            const roll = prompt("Roll Number:");
                                            if(name && roll) setStudents([{ id: Date.now().toString(), name, rollNumber: roll, batch: 'Senior', marks: [] }, ...students]);
                                        }}
                                        className="btn-primary px-6 py-3 rounded-2xl font-black flex items-center gap-2"
                                    ><Lucide.UserPlus size={20}/> Add Student</button>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {students.map(s => (
                                        <div key={s.id} onClick={() => setSelectedStudent(s)} className="glass-card p-6 rounded-[2rem] hover:border-indigo-600 transition-all cursor-pointer group shadow-sm">
                                            <div className="flex items-center gap-4 mb-6">
                                                <div className="h-14 w-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-xl">{s.name[0]}</div>
                                                <div className="truncate"><p className="font-black text-lg text-slate-900 truncate">{s.name}</p><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{s.rollNumber}</p></div>
                                            </div>
                                            <div className="flex justify-between items-center border-t pt-4 border-slate-50">
                                                <span className="text-[10px] font-black text-indigo-500 uppercase">{s.batch} Batch</span>
                                                <Lucide.ArrowRight size={18} className="text-slate-300 group-hover:text-indigo-600 transition-all"/>
                                            </div>
                                        </div>
                                    ))}
                                    {students.length === 0 && <div className="col-span-full py-20 text-center text-slate-300 font-black border-2 border-dashed rounded-[3rem]">No students registered yet.</div>}
                                </div>
                            </div>
                        )}

                        {view === 'roster' && selectedStudent && (
                            <div className="animate-fade-in">
                                <button onClick={() => setSelectedStudent(null)} className="flex items-center gap-2 text-indigo-600 font-black text-xs uppercase tracking-widest mb-8 hover:-translate-x-1 transition-all"><Lucide.ArrowLeft size={16}/> Back to Roster</button>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-1 space-y-6">
                                        <div className="glass-card p-10 rounded-[3rem] text-center shadow-lg">
                                            <div className="h-24 w-24 bg-indigo-50 text-indigo-600 rounded-[2rem] flex items-center justify-center font-black text-4xl mx-auto mb-6 shadow-inner">{selectedStudent.name[0]}</div>
                                            <h3 className="text-3xl font-black text-slate-900 mb-1">{selectedStudent.name}</h3>
                                            <p className="text-indigo-500 font-bold mb-8 uppercase tracking-widest text-xs">{selectedStudent.rollNumber} • {selectedStudent.batch}</p>
                                            <div className="space-y-2">
                                                <label className="block p-4 bg-indigo-600 text-white rounded-2xl font-black text-sm shadow-lg cursor-pointer hover:bg-indigo-700 transition-all text-center">
                                                    {isScanning ? <Lucide.Loader2 className="animate-spin mx-auto"/> : <><Lucide.Camera className="inline-block mr-2" size={18}/> AI Mark Scan</>}
                                                    <input type="file" className="hidden" accept="image/*" onChange={(e) => handleScanMarkSheet(selectedStudent.id, e.target.files[0])} disabled={isScanning}/>
                                                </label>
                                                <button onClick={() => {
                                                    const url = window.location.href.split('#')[0] + `#portal?sid=${selectedStudent.rollNumber}`;
                                                    navigator.clipboard.writeText(url);
                                                    alert("Student Portal Link Copied!");
                                                }} className="w-full p-4 bg-slate-50 text-slate-400 rounded-2xl font-black text-xs uppercase tracking-widest">Copy Portal Link</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-2 space-y-6">
                                        <div className="glass-card p-8 rounded-[2.5rem] shadow-sm">
                                            <h4 className="text-xl font-black mb-8 flex items-center gap-3"><Lucide.History className="text-indigo-600"/> Academic Performance</h4>
                                            <div className="space-y-3">
                                                {selectedStudent.marks.map((m, i) => (
                                                    <div key={i} className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
                                                        <span className="font-black text-slate-800">{m.subject}</span>
                                                        <span className="font-black text-indigo-600 text-xl">{m.score}/{m.total}</span>
                                                    </div>
                                                ))}
                                                {selectedStudent.marks.length === 0 && <p className="text-center py-20 text-slate-300 italic">No tests found. Try AI Scan or manual entry.</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'quizzes' && (
                            <div className="animate-fade-in space-y-8">
                                <header className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black text-slate-900 tracking-tight">AI Quiz Center</h2>
                                    <button 
                                        disabled={isGenerating}
                                        onClick={() => {
                                            const sub = prompt("Subject:");
                                            const top = prompt("Topic:");
                                            if(sub && top) generateQuiz(sub, top);
                                        }}
                                        className="btn-primary px-6 py-3 rounded-2xl font-black flex items-center gap-2"
                                    >{isGenerating ? <Lucide.Loader2 className="animate-spin" /> : <><Lucide.Plus size={20}/> Generate Quiz</>}</button>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {quizzes.map(q => (
                                        <div key={q.id} className="glass-card p-6 rounded-[2.5rem] relative overflow-hidden group shadow-sm">
                                            <div className="flex justify-between items-start mb-6">
                                                <div className="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg font-black text-[10px]">#{q.code}</div>
                                                <button onClick={() => setQuizzes(quizzes.filter(qz => qz.id !== q.id))} className="text-red-300 hover:text-red-500 transition-all"><Lucide.Trash2 size={18}/></button>
                                            </div>
                                            <h4 className="text-xl font-black text-slate-900 mb-1">{q.topic}</h4>
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-8">{q.subject} • {q.questions.length} Questions</p>
                                            <button 
                                                onClick={() => {
                                                    const text = `🚀 *MSK AI Quiz Alert* 🚀\n\nTopic: ${q.topic}\nSubject: ${q.subject}\n\nLogin Code: *${q.code}*\nGood Luck!`;
                                                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                                                }}
                                                className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-sm flex items-center justify-center gap-2 group-hover:scale-105 transition-all shadow-lg"
                                            ><Lucide.Send size={18}/> Share with Batch</button>
                                        </div>
                                    ))}
                                    {quizzes.length === 0 && <div className="col-span-full py-20 text-center text-slate-300 font-black border-2 border-dashed rounded-[3rem]">No AI quizzes built yet.</div>}
                                </div>
                            </div>
                        )}

                        {view === 'timetable' && (
                            <div className="animate-fade-in space-y-8">
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">Timetable</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {DAYS.map(day => (
                                        <div key={day} className="glass-card p-6 rounded-[2rem] shadow-sm">
                                            <h5 className="font-black text-indigo-900 border-b pb-3 mb-4">{day}</h5>
                                            <div className="space-y-3">
                                                {schedule.filter(s => s.day === day).map((item, i) => (
                                                    <div key={i} className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                                        <p className="font-black text-slate-800">{item.subject}</p>
                                                        <p className="text-[10px] text-slate-400 font-bold">{item.time}</p>
                                                    </div>
                                                ))}
                                                <button onClick={() => {
                                                    const sub = prompt("Subject:");
                                                    const time = prompt("Time (e.g. 10AM):");
                                                    if(sub && time) setSchedule([...schedule, { id: Date.now().toString(), day, subject: sub, time }]);
                                                }} className="w-full py-2 bg-indigo-50 text-indigo-600 rounded-xl text-[10px] font-black uppercase tracking-widest">+ Add</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'knowledge' && (
                            <div className="animate-fade-in space-y-8">
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">Knowledge Hub</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {facts.map((f, i) => (
                                        <div key={i} className="glass-card p-10 rounded-[3rem] shadow-sm hover:shadow-xl transition-all border-l-8 border-l-indigo-600">
                                            <h3 className="text-2xl font-black text-slate-900 mb-4">{f.title}</h3>
                                            <p className="text-slate-500 font-medium leading-relaxed text-lg">{f.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
